name: Build

on:
  push:
    tags: ['v*']          # 推送 v 开头标签 -> 构建并附属到 Release
    branches: [main]      # 日常推送 -> 构建测试产物
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 创建 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller)
        run: pyinstaller build.spec --noconfirm

      - name: Package zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path dist/OneMail.exe -DestinationPath "dist/OneMail-$version-win64.zip"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifacts (every build)
        uses: actions/upload-artifact@v4
        with:
          name: OneMail-${{ env.VERSION }}-win64
          path: |
            dist/OneMail.exe
            dist/*.zip
          retention-days: 14

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OneMail.exe
            dist/*.zip
          generate_release_notes: true
